name: Build AX5 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: [jdcloud_re-ss-01, xiaomi_rm1800]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget \
            python3-setuptools swig libelf-dev

      - name: Cache DL and Toolchain
        uses: actions/cache@v4
        with:
          path: |
            dl
            build_dir/toolchain-*
          key: ${{ runner.os }}-openwrt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-openwrt-

      - name: Add Extra Feeds (可选)
        run: |
          # 需要科学上网插件的话，取消下面两行注释
          # echo "src-git openclash https://github.com/vernesong/OpenClash" >> feeds.conf.default
          # echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall2" >> feeds.conf.default
          echo "src-git vantage https://github.com/anothaDev/luci-theme-vantage" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y
          CONFIG_TESTING_KERNEL=y
          CONFIG_BUSYBOX_CUSTOM=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-vantage=y
          CONFIG_PACKAGE_luci-app-ttyd=n
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ddns=n
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-samba4=n
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-app-filebrowser=n
          CONFIG_PACKAGE_luci-app-smartdns=n
          CONFIG_PACKAGE_luci-app-adguardhome=n
          CONFIG_PACKAGE_luci-app-nft-qos=y
          CONFIG_PACKAGE_luci-app-banip=n
          CONFIG_PACKAGE_luci-app-ssr-plus=n
          EOF
          make defconfig

      - name: Download Source
        run: make download -j8

      - name: Build Firmware
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax5-firmware-${{ matrix.device }}
          path: bin/targets/qualcommax/ipq60xx/
